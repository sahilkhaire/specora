name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core types for workspace resolution
        run: npm run -w @specora/core build

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run check:boundaries

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: packages/sdk-go/go.sum

      - name: Test Go SDK
        working-directory: packages/sdk-go
        run: |
          go mod tidy
          go vet ./...
          go test ./...
