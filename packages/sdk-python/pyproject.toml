[project]
name = "specora"
version = "0.1.0"
description = "Specora OpenAPI documentation embed SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.32.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["specora*"]
