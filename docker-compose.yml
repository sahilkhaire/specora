services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8788:8788"
    environment:
      PORT: "8788"
      DATABASE_URL: "file:/data/specora.db"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:80"
      # Self-hosted enterprise only: POST /proxy for try-out CORS bypass (disabled on hosted SaaS API).
      PROXY_ENABLED: "true"
      SPECORA_ADMIN_PASSWORD: "${SPECORA_ADMIN_PASSWORD:-specora-admin}"
      INSTANCE_BASE_DOMAIN: "${INSTANCE_BASE_DOMAIN:-localhost}"
    volumes:
      - api-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: "http://localhost:8788"
      VITE_DEPLOYMENT_MODE: "${VITE_DEPLOYMENT_MODE:-enterprise}"
      VITE_ENABLE_SAAS_AUTH: "false"
    depends_on:
      - api

volumes:
  api-data:
